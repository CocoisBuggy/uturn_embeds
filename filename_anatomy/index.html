<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filename Anatomy</title>
    <style>
    @keyframes swap-out {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    @keyframes swap-in {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .swap-out {
      animation: swap-out 200ms ease-in forwards;
    }

    .swap-in {
      animation: swap-in 380ms ease-out 220ms both;
    }

    .anno-col {
      --anno-x: 50%;
      --anno-origin: center;
      align-items: center;
      cursor: pointer;
    }

    .anno-col.align-left {
      --anno-x: 1.75rem;
      align-items: flex-start;
    }

    .anno-col.grow-down {
      --anno-origin: top;
    }
    .anno-col.grow-up {
      --anno-origin: bottom;
    }

    .anno-line {
      position: absolute;
      left: var(--anno-x);
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #94a3b8;
      transform: translateX(-50%) scaleY(1);
      transform-origin: var(--anno-origin);
      transition:
        transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1),
        width 220ms ease,
        background-color 220ms ease;
    }

    .anno-arrow {
      position: absolute;
      left: var(--anno-x);
      background-color: #86d49a;
      opacity: 0;
      transform: translateX(-50%) scale(0.4) rotate(45deg);
      transition:
        opacity 160ms ease-in,
        transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .anno-col.hlt .anno-pill {
      --tw-bg-opacity: 1;
      background-color: rgb(22 163 74 / var(--tw-bg-opacity));
      border-color: rgb(22 163 74 / var(--tw-bg-opacity));
      color: #fff;
    }

    .anno-col.hlt .anno-line {
      transform: translateX(-50%) scaleY(1);
      background-color: #16a34a;
      width: 2px;
    }

    .anno-col.hlt .anno-arrow {
      opacity: 1;
      background-color: #16a34a;
      box-shadow: 0 0 0 4px rgb(22 163 74 / 0.15);
      transform: translateX(-50%) scale(1) rotate(45deg);
    }
    </style>
  </head>

  <body class="flex h-screen w-screen items-center justify-center overflow-hidden bg-green-50 text-slate-800">
    <script type="module" src="./src/main.ts"></script>
    <div class="floor"></div>
  </body>
</html>
